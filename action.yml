name: "releases-api-sync-action"
description: "Rotate Spring project releases on api.spring.io"
author: "jzheaux"
inputs:
  version:
    description: "The current GA version"
    required: true
  github-token:
    description: "GitHub PAT, used for authenticating to api.spring.io"
    required: true
  api-doc-url:
    description: "Docs template with {version}"
    default: "https://docs.spring.io/{slug}/docs/{version}/javadoc-api"
    required: false
  base-uri:
    description: "Base URI for the Spring Project Service"
    default: "https://api.spring.io"
    required: false
  is-antora:
    description: "Whether the reference documentation is Antora-based; defaults to true"
    default: "true"
    required: false
  reference-doc-url:
    description: "Reference docs template with {version}"
    default: "https://docs.spring.io/{slug}/reference/{version}/index.html"
    required: false
  slug:
    description: "Spring project slug (e.g., spring-security); will use repo name if not provided"
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - --releases.api.uri=${{ inputs.base-uri }}
    - --releases.api.token=${{ inputs.github-token }}
    - --releases.project.slug=${{ inputs.slug || github.event.repository.name }}
    - --releases.project.version=${{ inputs.version }}
    - --releases.project.apidoc.url=${{ inputs.api-doc-url }}
    - --releases.project.refdoc.url=${{ inputs.reference-doc-url }}
    - --releases.project.refdoc.antora=${{ inputs.is-antora }}